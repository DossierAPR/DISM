<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Schedule</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #eef0f4;
    --text-dim: #7d8290;
    --accent: #7c9cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 28px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  /* Now card */
  .now-card {
    text-align: center;
    padding: 28px 20px;
    margin-bottom: 28px;
  }
  .clock {
    font-size: 32px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin: 0 0 2px;
  }
  .date {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 18px;
  }
  .now-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .now-task {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0 0 8px;
  }
  .now-timer {
    font-size: 14px;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
  .now-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin: 4px 0 0;
  }

  h1 {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dim);
    margin: 0 0 14px;
    text-align: center;
  }
  .status {
    font-size: 11px;
    color: var(--text-dim);
    height: 14px;
    text-align: center;
    margin-bottom: 6px;
  }

  .row {
    display: grid;
    grid-template-columns: 16px 100px 1fr 30px;
    gap: 8px;
    align-items: center;
    padding: 8px 4px;
    border-bottom: 0.5px solid var(--border);
  }
  .row.active { background: rgba(124,156,255,0.08); border-radius: 6px; }
  .row.dragging { opacity: 0.35; }
  .drag-handle {
    cursor: grab;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    user-select: none;
  }
  input[type="text"] {
    background: transparent;
    border: none;
    color: var(--text);
    padding: 6px 4px;
    font-size: 13px;
    width: 100%;
    border-radius: 4px;
  }
  input[type="text"]:focus { outline: none; background: #1c202a; }
  .time-input { color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .del-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
  }
  .del-btn:hover { color: var(--danger); }

  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  button.main {
    background: transparent;
    border: 0.5px solid var(--border);
    color: var(--text-dim);
    border-radius: 7px;
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  button.main:hover { color: var(--text); border-color: var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <div class="now-card">
    <p class="clock" id="clock"></p>
    <p class="date" id="dateLine"></p>
    <p class="now-label">right now</p>
    <p class="now-task" id="nowTask">—</p>
    <p class="now-timer" id="nowTimer"></p>
    <p class="now-sub" id="nowSub"></p>
  </div>

  <h1 id="title" contenteditable="true">Daily schedule</h1>
  <div class="status" id="status"></div>

  <div id="rows"></div>

  <div class="actions">
    <button class="main" id="addRow">+ add row</button>
    <button class="main" id="resetBtn">reset</button>
  </div>
</div>

<script>
const DEFAULT_ROWS = [
  { time: "3:30–4:00", task: "🏠 Get home + eat + chill" },
  { time: "4:00–4:30", task: "🎮 ACTUAL REST. YT/game/lie down" },
  { time: "4:30–5:30", task: "📚 Study Session 1 — 1h" },
  { time: "5:30–5:50", task: "☕ Break — 20m" },
  { time: "5:50–6:50", task: "📚 Study Session 2 — 1h" },
  { time: "6:50–7:20", task: "💪 Workout — 30m" },
  { time: "7:20–8:00", task: "🍽️ Dinner + FREE TIME — 40m" },
  { time: "8:00–8:45", task: "🧠 Study Session 3 — 45m" },
  { time: "8:45–9:00", task: "🛋️ BREAK — 15m" },
  { time: "9:00–9:45", task: "✍️ Study Session 4 — 45m" },
  { time: "9:45–11:00", task: "🎮 FREE + get ready for sleep" }
];

let rows = [];
let dragIndex = null;
const rowsEl = document.getElementById('rows');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const STORAGE_KEY = 'schedule-data-v2';
const TITLE_KEY = 'schedule-title';

function showStatus(msg) {
  statusEl.textContent = msg;
  setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ''; }, 1200);
}

async function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(rows));
    showStatus('saved');
  } catch (e) {
    showStatus('could not save');
  }
}
async function saveTitle() {
  try { localStorage.setItem(TITLE_KEY, titleEl.textContent); } catch (e) {}
}

function parseTimeToken(tok) {
  const m = tok.trim().toLowerCase().match(/(\d{1,2}):(\d{2})\s*(am|pm)?/);
  if (!m) return null;
  let h = parseInt(m[1]), min = parseInt(m[2]), ap = m[3];
  if (ap === 'am') { if (h === 12) h = 0; }
  else if (ap === 'pm') { if (h !== 12) h += 12; }
  else { if (h >= 1 && h <= 11) h += 12; }
  return h * 60 + min;
}
function parseRange(str) {
  const parts = str.split(/–|-|—|to/i).map(s => s.trim()).filter(Boolean);
  if (parts.length < 2) return null;
  const start = parseTimeToken(parts[0]);
  const end = parseTimeToken(parts[1]);
  if (start === null || end === null) return null;
  return { start, end };
}
function fmtMins(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h > 0) return m > 0 ? `${h}h ${m}m` : `${h}h`;
  return `${m}m`;
}

function fmtClock(d) {
  let h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ap}`;
}
function fmtDate(d) {
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

function updateNow() {
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();

  document.getElementById('clock').textContent = fmtClock(now);
  document.getElementById('dateLine').textContent = fmtDate(now);
  const parsed = rows.map(r => ({ ...r, range: parseRange(r.time) }));

  let active = null, next = null;
  for (const r of parsed) {
    if (!r.range) continue;
    if (nowMins >= r.range.start && nowMins < r.range.end) active = r;
  }
  for (const r of parsed) {
    if (!r.range) continue;
    if (r.range.start > nowMins && (!next || r.range.start < next.range.start)) next = r;
  }

  const taskEl = document.getElementById('nowTask');
  const timerEl = document.getElementById('nowTimer');
  const subEl = document.getElementById('nowSub');

  if (active) {
    taskEl.textContent = active.task || 'Untitled';
    const remaining = active.range.end - nowMins;
    const elapsed = nowMins - active.range.start;
    timerEl.textContent = `${fmtMins(remaining)} left · started ${fmtMins(elapsed)} ago`;
    subEl.textContent = next ? `next: ${next.task}` : '';
  } else if (next) {
    taskEl.textContent = 'Free time';
    timerEl.textContent = `${next.task} in ${fmtMins(next.range.start - nowMins)}`;
    subEl.textContent = '';
  } else {
    taskEl.textContent = 'Nothing scheduled';
    timerEl.textContent = '';
    subEl.textContent = '';
  }

  document.querySelectorAll('.row').forEach((el, i) => {
    el.classList.toggle('active', parsed[i] === active);
  });
}

function render() {
  rowsEl.innerHTML = '';
  rows.forEach((row, i) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    rowEl.draggable = true;
    rowEl.dataset.index = i;
    rowEl.innerHTML = `
      <div class="drag-handle">⋮⋮</div>
      <input type="text" class="time-input" value="${escapeHtml(row.time)}" data-field="time" data-index="${i}">
      <input type="text" value="${escapeHtml(row.task)}" data-field="task" data-index="${i}">
      <button class="del-btn" data-index="${i}" title="Delete">✕</button>
    `;
    rowsEl.appendChild(rowEl);

    rowEl.addEventListener('dragstart', () => { dragIndex = i; rowEl.classList.add('dragging'); });
    rowEl.addEventListener('dragend', () => rowEl.classList.remove('dragging'));
    rowEl.addEventListener('dragover', e => e.preventDefault());
    rowEl.addEventListener('drop', () => {
      if (dragIndex === null || dragIndex === i) return;
      const moved = rows.splice(dragIndex, 1)[0];
      rows.splice(i, 0, moved);
      dragIndex = null;
      render();
      save();
    });
  });

  rowsEl.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      rows[e.target.dataset.index][e.target.dataset.field] = e.target.value;
      updateNow();
    });
    inp.addEventListener('blur', save);
  });
  rowsEl.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      rows.splice(e.target.dataset.index, 1);
      render();
      save();
    });
  });
  updateNow();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('addRow').addEventListener('click', () => {
  rows.push({ time: "New time", task: "New task" });
  render();
  save();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  rows = JSON.parse(JSON.stringify(DEFAULT_ROWS));
  render();
  save();
  showStatus('reset');
});
titleEl.addEventListener('blur', saveTitle);

async function init() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    rows = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(DEFAULT_ROWS));
  } catch (e) {
    rows = JSON.parse(JSON.stringify(DEFAULT_ROWS));
  }
  try {
    const t = localStorage.getItem(TITLE_KEY);
    if (t) titleEl.textContent = t;
  } catch (e) {}
  render();
  setInterval(updateNow, 1000);
}
init();
</script>
</body>
</html>
